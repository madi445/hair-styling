<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мой курс | Silk Styling</title><link rel="stylesheet" href="/frontend/course.css"></head><body><header class="shell topbar"><a class="brand" href="/course/"><span class="brand-mark">S</span>Silk Styling</a><button class="button secondary" id="logout" type="button" hidden>Выйти</button></header><main class="shell page"><section class="panel"><span class="kicker">Личный кабинет</span><h1>Мой курс</h1><p class="lead" id="state">Проверяем доступ…</p><div id="lessons" class="lesson-list"></div><form id="loginForm" class="stack" hidden><h2>Вход в аккаунт</h2><label class="field-label" for="email">Email</label><input class="field" id="email" name="email" type="email" autocomplete="email" required><label class="field-label" for="password">Пароль</label><input class="field" id="password" name="password" type="password" autocomplete="current-password" required><p class="error" id="error" role="alert"></p><button class="button" type="submit">Войти</button></form><a class="button secondary" href="/course/payment/">Перейти к оплате</a></section></main><script>
const API_BASE=location.port==='5500'?'http://localhost:3000':'';const api=(url,options={})=>fetch(API_BASE+url,{credentials:'include',...options});const state=document.querySelector('#state');const form=document.querySelector('#loginForm');const lessons=document.querySelector('#lessons');const logout=document.querySelector('#logout');async function loadCourse(){const response=await api('/api/my-course');if(response.status===401){state.textContent='Войдите в аккаунт, связанный с вашим платежом.';form.hidden=false;logout.hidden=true;return}const data=await response.json();if(!response.ok){state.textContent=data.error;form.hidden=true;logout.hidden=true;return}form.hidden=true;logout.hidden=false;state.textContent=`Здравствуйте, ${data.user.name}. Доступ к курсу открыт.`;lessons.replaceChildren();for(const lesson of data.lessons){const link=document.createElement('a');link.className='lesson';link.href=lesson.url;link.innerHTML=`<span><strong>${lesson.title}</strong><br><span class="muted">${lesson.description}</span></span><span>Смотреть →</span>`;lessons.appendChild(link)}}form.addEventListener('submit',async(event)=>{event.preventDefault();const response=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value,password:form.password.value})});const result=await response.json();if(!response.ok){document.querySelector('#error').textContent=result.error;return}loadCourse()});logout.addEventListener('click',async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()});loadCourse().catch(()=>{state.textContent='Не удалось подключиться к серверу.'});
</script></body></html>
