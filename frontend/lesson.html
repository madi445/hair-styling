<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Урок | Silk Styling</title><link rel="stylesheet" href="/frontend/course.css"></head><body><header class="shell topbar"><a class="brand" href="/course/my-course/"><span class="brand-mark">S</span>Мой курс</a><a class="top-link" href="/course/my-course/">Все уроки</a></header><main class="shell page"><section class="panel"><span class="kicker">Урок курса</span><h1 id="title">Проверяем доступ…</h1><p class="lead" id="state"></p><div class="video-wrap" id="videoWrap" hidden><video id="lessonVideo" preload="metadata" controls controlsList="nodownload" disablePictureInPicture playsinline></video><div class="watermark" id="watermark"></div></div></section></main><script>
const API_BASE=location.port==='5500'?'http://localhost:3000':'';const video=document.querySelector('#lessonVideo');const lessonId=location.pathname.split('/').filter(Boolean).at(-1);async function load(){const response=await fetch(`${API_BASE}/api/my-course`,{credentials:'include'});const data=await response.json();if(!response.ok){document.querySelector('#title').textContent='Доступ закрыт';document.querySelector('#state').textContent=data.error||'Войдите в аккаунт.';return}const lesson=data.lessons.find((item)=>item.id===lessonId);if(!lesson){document.querySelector('#title').textContent='Урок не найден';return}document.querySelector('#title').textContent=lesson.title;document.querySelector('#state').textContent=lesson.description;document.querySelector('#watermark').textContent=`Пляжные небрежные локоны — ${data.user.name} / ${data.user.email}`;video.src=`${API_BASE}/api/lessons/${encodeURIComponent(lesson.id)}/video`;document.querySelector('#videoWrap').hidden=false}video.addEventListener('error',()=>{document.querySelector('#state').textContent='Не удалось загрузить видео. Обновите страницу или обратитесь к организатору обучения.'});video.addEventListener('contextmenu',(event)=>event.preventDefault());load().catch(()=>{document.querySelector('#state').textContent='Не удалось подключиться к серверу.'});
</script></body></html>
