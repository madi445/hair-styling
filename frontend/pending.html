<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статус платежа | Silk Styling</title><link rel="stylesheet" href="/frontend/course.css"></head><body><header class="shell topbar"><a class="brand" href="/course/"><span class="brand-mark">S</span>Silk Styling</a><a class="top-link" href="/course/my-course/">Мой курс</a></header><main class="shell page"><section class="panel"><span class="kicker">Статус платежа</span><h1 id="heading">Проверяем отправку…</h1><p class="lead" id="message">Загружаем ваши платежи.</p><div id="payments" class="stack"></div><p class="hint">Страница обновляет статус автоматически. Доступ к урокам появится только после подтверждения оплаты.</p><a class="button secondary" href="/course/payment/">Вернуться к оплате</a></section></main><script>
const API_BASE=location.port==='5500'?'http://localhost:3000':'';const api=(url)=>fetch(API_BASE+url,{credentials:'include'});const labels={Pending:'Ожидает проверки',Paid:'Оплата подтверждена',Rejected:'Оплата отклонена'};async function check(){const response=await api('/api/my-payments');if(response.status===401){document.querySelector('#heading').textContent='Войдите в аккаунт';document.querySelector('#message').textContent='Чтобы проверить платёж, войдите с email и паролем, которые указали при отправке чека.';return}const data=await response.json();const root=document.querySelector('#payments');root.replaceChildren();if(!data.payments.length){document.querySelector('#heading').textContent='Платежей пока нет';document.querySelector('#message').textContent='После отправки скриншота платежи появятся здесь.';return}const latest=data.payments[0];document.querySelector('#heading').textContent=latest.status==='Paid'?'Оплата подтверждена':latest.status==='Rejected'?'Оплата отклонена':'Платёж на проверке';document.querySelector('#message').textContent=latest.status==='Paid'?'Доступ открыт. Переходим в ваш курс…':latest.status==='Rejected'?'Оплата не подтверждена. Свяжитесь с нами, если считаете это ошибкой.':'Мы сверяем сумму и скриншот оплаты.';for(const item of data.payments){const row=document.createElement('div');row.className='lesson';row.innerHTML=`<span>${Number(item.amount).toLocaleString('ru-KZ')} ₸ · ${new Date(item.created_at).toLocaleString('ru-RU')}</span><span class="status-pill status-${item.status.toLowerCase()}">${labels[item.status]}</span>`;root.appendChild(row)}if(latest.status==='Paid')setTimeout(()=>location.replace('/course/my-course/'),1200)}check().catch(()=>{document.querySelector('#message').textContent='Не удалось загрузить статус. Проверьте, что backend запущен.'});setInterval(()=>check().catch(()=>{}),5000);
</script></body></html>
