services:
  - type: web
    name: silk-styling-course
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.21.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/silk-styling.sqlite
      - key: VIDEO_PATH
        value: /var/data/lesson-1.mp4
      - key: ADMIN_PASSWORD
        generateValue: true
    disk:
      name: silk-styling-data
      mountPath: /var/data
      sizeGB: 5
